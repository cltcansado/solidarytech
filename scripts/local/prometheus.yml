global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "ngo-service"
    static_configs:
      - targets: ["ngo-service:8081"]
    metrics_path: /metrics

  - job_name: "donation-service"
    static_configs:
      - targets: ["donation-service:8082"]
    metrics_path: /metrics

  - job_name: "volunteer-service"
    static_configs:
      - targets: ["volunteer-service:8083"]
    metrics_path: /metrics

  - job_name: "healer-service"
    static_configs:
      - targets: ["healer-service:8090"]
    metrics_path: /metrics

  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
