# Ambiente local completo da SolidaryTech - permite rodar e validar os 3 microsserviços
# e a stack de observabilidade SEM depender de AWS. Usado na Etapa E1 (validação local)
# e como "golden path" de desenvolvimento antes de qualquer coisa ir para o cluster via GitOps.
#
# Uso:
#   docker compose up --build
#   ngo-service:       http://localhost:8081/health
#   donation-service:  http://localhost:8082/health
#   volunteer-service: http://localhost:8083/health
#   healer-service:    http://localhost:8090/health   (sem cluster real, roda mas não reinicia nada)
#   Prometheus:        http://localhost:9090
#   Grafana:            http://localhost:3000 (admin/admin)

services:
  postgres-ngo:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ngo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./apps/ngo-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-donation:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: donation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5433:5432"]
    volumes:
      - ./apps/donation-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb-local:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports: ["8000:8000"]

  dynamodb-init:
    image: amazon/aws-cli:2.15.0
    depends_on: [dynamodb-local]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1;
        do sleep 1; done;
        aws dynamodb create-table
        --table-name SolidaryTechVolunteers
        --attribute-definitions AttributeName=volunteer_id,AttributeType=S
        --key-schema AttributeName=volunteer_id,KeyType=HASH
        --billing-mode PAY_PER_REQUEST
        --endpoint-url http://dynamodb-local:8000 || true

  elasticmq:
    image: softwaremill/elasticmq-native:1.5.7
    ports: ["9324:9324", "9325:9325"]
    volumes:
      - ./scripts/local/elasticmq.conf:/opt/elasticmq.conf:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./scripts/local/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports: ["4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./scripts/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:10.4.2
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./gitops/observability/grafana-dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  ngo-service:
    build: ./apps/ngo-service
    depends_on:
      postgres-ngo: { condition: service_healthy }
    environment:
      PORT: 8081
      DATABASE_URL: postgres://postgres:postgres@postgres-ngo:5432/ngo_db
      ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8081:8081"]

  donation-service:
    build: ./apps/donation-service
    depends_on:
      postgres-donation: { condition: service_healthy }
    environment:
      PORT: 8082
      DATABASE_URL: postgres://postgres:postgres@postgres-donation:5432/donation_db
      AWS_REGION: us-east-1
      AWS_SQS_URL: http://elasticmq:9324/queue/solidary-donations
      ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
    ports: ["8082:8082"]

  volunteer-service:
    build: ./apps/volunteer-service
    depends_on: [dynamodb-init]
    environment:
      PORT: 8083
      AWS_REGION: us-east-1
      AWS_DYNAMODB_TABLE: SolidaryTechVolunteers
      AWS_DYNAMODB_ENDPOINT_URL: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports: ["8083:8083"]

  healer-service:
    build: ./apps/healer-service
    environment:
      PORT: 8090
      TARGET_NAMESPACE: solidarytech
    ports: ["8090:8090"]
