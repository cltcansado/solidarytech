name: CI — volunteer-service

on:
  push:
    branches: [main]
    paths: ["apps/volunteer-service/**", ".github/workflows/ci-volunteer-service.yml"]
  pull_request:
    paths: ["apps/volunteer-service/**"]
  workflow_dispatch: {}

env:
  IMAGE: ${{ secrets.ECR_REGISTRY }}/solidarytech/volunteer-service

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/volunteer-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  security-scan:
    runs-on: ubuntu-latest
    needs: test
    env:
      SONAR_TOKEN_SET: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Trivy — filesystem/dependência (SCA)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: fs
          scan-ref: apps/volunteer-service
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: SonarCloud — SAST
        if: ${{ env.SONAR_TOKEN_SET == 'true' }}
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: apps/volunteer-service
          args: >
            -Dsonar.projectKey=solidarytech-volunteer-service
            -Dsonar.organization=${{ secrets.SONAR_ORG }}

  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build da imagem
        run: docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" apps/volunteer-service

      - name: Trivy — imagem de container (relatório, não bloqueia)
        # exit-code 0 de propósito: ver justificativa em ci-ngo-service.yml (mesma base
        # distroless, mesmos achados são pacotes de SO fora do nosso controle).
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: "${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}"
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Push para o ECR
        run: docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

  gitops-bump:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Clona o repo gitops
        run: git clone "https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/cltcansado/solidarytech-gitops.git" gitops-repo

      - name: Atualiza a tag da imagem e commita (retry para runs concorrentes de outros serviços)
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            sed -i "s|image: .*volunteer-service:.*|image: ${{ env.IMAGE }}:${{ needs.build-and-push.outputs.image_tag }}|" \
              apps/volunteer-service/deployment.yaml
            git add apps/volunteer-service/deployment.yaml
            git diff --cached --quiet && break
            git commit -m "ci(volunteer-service): bump image to ${{ needs.build-and-push.outputs.image_tag }}"
            git push && break
            git fetch origin main && git reset --hard origin/main
            sleep $((RANDOM % 4 + 1))
          done
